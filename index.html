<script>
/* ================= EXPORT / BACKUP / IMPORT ================= */
function stamp(){ const d=new Date();
  return d.getFullYear()+two(d.getMonth()+1)+two(d.getDate())+'_'+two(d.getHours())+two(d.getMinutes()); }
/* Salvează un fișier și raportează ce s-a întâmplat:
   true = sigur salvat · false = utilizatorul a anulat · 'unknown' = browserul nu ne spune */
async function downloadOrShare(name, mime, content){
  // 1. Selector de fișier: alegi tu unde salvezi ȘI aplicația află dacă ai anulat.
  if(window.showSaveFilePicker){
    try{
      const ext='.'+name.split('.').pop();
      const h=await window.showSaveFilePicker({suggestedName:name,
        types:[{description:'Fișier Nivelo', accept:{[mime]:[ext]}}]});
      const w=await h.createWritable();
      await w.write(content); await w.close();
      return true;
    }catch(err){
      if(err && err.name==='AbortError') return false;   // ai anulat: nu s-a salvat nimic
      /* altă eroare: încercăm metodele de mai jos */
    }
  }
  const blob=new Blob([content],{type:mime});
  const file=new File([blob], name, {type:mime});
  // 2. Foaia de partajare (Drive, Gmail, Fișiere...)
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return true; }
    catch(err){ if(err && err.name==='AbortError') return false; }
  }
  // 3. Descărcare simplă. Browserul NU ne comunică rezultatul, deci nu putem promite nimic.
  plainDownload(blob,name);
  return 'unknown';
}
function plainDownload(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
/* ================= PROTECȚIA STOCĂRII =================
   Browserele pot șterge singure datele site-urilor. Safari pe iPhone
   evacuează datele site-urilor NEINSTALATE după ~7 zile de neutilizare.
   Cerem explicit browserului să păstreze datele și avertizăm dacă
   aplicația rulează într-o filă, nu instalată pe ecranul principal. */
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent||'');
const isInstalled=()=>{
  try{ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }
  catch(e){ return false; }
};
let PERSIST_OK=null;
async function askPersist(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return;
    PERSIST_OK = navigator.storage.persisted ? await navigator.storage.persisted() : false;
    if(!PERSIST_OK) PERSIST_OK = await navigator.storage.persist();
  }catch(e){ PERSIST_OK=null; }
}
function riskyStorage(){ return isIOS() && !isInstalled(); }
/* Avertizare ÎNAINTE ca spațiul să se umple. Odată umplut, salvările eșuează și
   singurul lucru pe care îl mai putem face e să dăm o veste proastă; e mult mai
   util să prevenim. Cota pe iPhone e mult mai mică decât pe Android, deci pragul
   e ținut prudent. Verificarea e best-effort: unele browsere nu o oferă. */
async function quotaWarn(){
  const el=$('quotawarn'); if(!el) return;
  el.innerHTML=''; el.style.display='none';
  if(S.events.length<=3) return;
  try{
    const est=await navigator.storage.estimate();
    if(!est || !est.quota) return;
    const pct=est.usage/est.quota;
    if(pct < 0.8) return;
    el.innerHTML='<b>Spațiul de pe telefon e aproape plin.</b>'
      +'Jurnalul e la '+Math.round(pct*100)+'% din cât poate ține aplicația. '
      +'Dacă se umple, notările noi nu se mai salvează. Salvează o copie acum, apoi eliberează spațiu pe telefon.'
      +'<br><button onclick="backupNow()">Salvează o copie →</button>';
    el.style.display='block';
  }catch(e){}
}
function storageWarn(){
  const el=$('storagewarn'); if(!el) return;
  if(!riskyStorage() || S.events.length<=3){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="card" style="border-left:4px solid var(--high)">
    <b style="display:block; margin-bottom:4px">Instalează aplicația pe ecranul principal</b>
    <span class="muted">Deschisă doar din Safari, aplicația își poate pierde datele: iPhone-ul șterge datele site-urilor nefolosite câteva zile. Apasă butonul de partajare din Safari și alege „Adaugă la ecranul principal". Până atunci, fă-ți des backup.</span>
  </div>`;
}
/* ================= ANULAREA UNEI OPERAȚIUNI =================
   Nu salvăm o copie a întregului jurnal (ar dubla consumul de memorie și
   ar risca depășirea cotei pe iPhone). Salvăm doar ce s-ar pierde:
   evenimentele șterse, sau id-urile celor adăugate la un import. */
const UNDO_KEY='glucolog_undo';
const UNDO_MS=10*60*1000;   // oferta de anulare expiră în 10 minute
function setUndo(rec){
  rec.ts=Date.now();
  try{ localStorage.setItem(UNDO_KEY, JSON.stringify(rec)); showUndoBar(rec); }
  catch(e){ try{ localStorage.removeItem(UNDO_KEY); }catch(_){} }   // fără loc: mergem mai departe
}
function getUndo(){
  try{ const r=JSON.parse(localStorage.getItem(UNDO_KEY));
       if(r && r.ts && Date.now()-r.ts<UNDO_MS) return r; }catch(e){}
  return null;
}
function clearUndo(){ try{ localStorage.removeItem(UNDO_KEY); }catch(e){} hideUndoBar(); }
function showUndoBar(rec){
  const el=$('undobar'); if(!el) return;
  el.innerHTML=`<span><b>${esc(rec.label)}</b></span><button onclick="runUndo()">Anulează</button>`;
  el.classList.add('on');
  clearTimeout(el._x); el._x=setTimeout(hideUndoBar, 12000);
}
function hideUndoBar(){ const el=$('undobar'); if(el){ el.classList.remove('on'); clearTimeout(el._x); } }
function runUndo(){
  const r=getUndo();
  if(!r){ hideUndoBar(); toast('Nu mai pot anula operațiunea'); return; }
  if(r.op==='del'){
    const have=new Set(S.events.map(e=>e.id));
    (r.items||[]).forEach(it=>{ if(!have.has(it.id)) S.events.push(it); });
    sortEv();
  } else if(r.op==='import'){
    const ids=new Set(r.ids||[]);
    if(ids.size) S.events=S.events.filter(e=>!ids.has(e.id));
    const fids=new Set(r.foodIds||[]);
    if(fids.size) S.foods=S.foods.filter(f=>!fids.has(f.id));
  }
  save(); clearUndo();
  renderToday(); renderHist(); renderFoods(); renderStats();
  toast(r.undone||'Am pus la loc');
}
function backupSpan(){
  const evs=S.events;
  if(!evs.length) return null;
  return {n:evs.length, from:dKey(evs[0].ts), to:dKey(evs[evs.length-1].ts)};
}
/* Verificăm copia ÎNAINTE de a o da utilizatorului. Până acum raportam „salvat"
   fără să ne uităm la ce am produs: dacă textul ar fi ieșit incomplet, omul ar fi
   plecat liniștit cu un fișier care nu se poate pune la loc. Cel mai prost moment
   să afli asta e când ai nevoie de el. Verificarea e ieftină: îl citim înapoi și
   comparăm ce conține cu ce e în aplicație. */
function verifyBackup(text){
  try{
    const d=JSON.parse(text);
    if(!d || !Array.isArray(d.events)) return {ok:false, de:'lipsesc intrările'};
    if(d.events.length!==S.events.length) return {ok:false, de:'numărul de intrări nu se potrivește'};
    if(!Array.isArray(d.foods)) return {ok:false, de:'lipsește biblioteca de alimente'};
    if(d.foods.length!==(S.foods||[]).length) return {ok:false, de:'numărul de alimente nu se potrivește'};
    if(!d.settings) return {ok:false, de:'lipsesc setările'};
    return {ok:true, ev:d.events.length, al:d.foods.length};
  }catch(e){ return {ok:false, de:'fișierul nu se poate citi înapoi'}; }
}
async function backupNow(){
  const name='Nivelo_backup_'+(S.settings.name||'profil')+'_'+stamp()+'.json';
  const info=backupSpan();
  const text=JSON.stringify(S,null,1);
  const v=verifyBackup(text);
  if(!v.ok){
    shAlert('Am pregătit copia, dar la verificare am găsit o problemă: '+v.de+'.\n\nNu îți dau un fișier în care nu pot avea încredere. Încearcă din nou, iar dacă se repetă, folosește exportul Excel sau CSV ca variantă de rezervă.',
      {ic:'🛑', title:'Copia NU a trecut verificarea', ok:'Am înțeles'});
    return;
  }
  const res=await downloadOrShare(name,'application/json',text);
  if(res===false){
    // ai anulat salvarea: nu marcăm nimic, bannerul rămâne aprins
    shAlert('Ai închis fereastra de salvare, deci fișierul nu a ajuns nicăieri. Încearcă din nou și alege unde să-l salvezi (de exemplu Drive).',
      {ic:'📭', title:'Backupul NU a fost salvat', ok:'Am înțeles'});
    return;
  }
  S.settings.lastBackup=Date.now();
  S.settings.bkFake=0;   // de acum e un backup adevărat, nu ceasul de pornire
  save(); bannerCheck(); renderBkLine(); renderMore(); renderQuickStart();
  const det = info ? nUnit(info.n,'intrări','o intrare') : 'jurnal gol';
  if(res==='unknown'){
    // descărcare simplă: browserul nu ne spune dacă a reușit, deci lăsăm o portiță
    shAlert('Fișierul a plecat spre Descărcări ('+det+'), verificat că se poate pune la loc.\nMută-l undeva sigur, de exemplu în Drive. Cu el poți reface jurnalul pe orice telefon.',
      {ic:'🛟', title:'Backup pregătit', ok:'L-am găsit, e bine',
       alt:{t:'Nu găsesc fișierul', go:'backupNotFound()'}});
  } else {
    shAlert('Salvat '+det+', verificat că se poate pune la loc.\nȚine fișierul undeva sigur, de exemplu în Drive. Cu el poți reface jurnalul pe orice telefon.',
      {ic:'🛟', title:'Backup salvat', ok:'Perfect'});
  }
}
function backupNotFound(){
  S.settings.lastBackup=0; save();
  bannerCheck(); renderBkLine(); renderMore(); renderQuickStart(); closeSheet2();
  shAlert('Am marcat backupul ca nefăcut, ca să nu te bazezi pe un fișier care nu există.\nCaută-l în Descărcări sau în aplicația Fișiere. Dacă tot nu apare, mai încearcă o dată.',
    {ic:'🔎', title:'Bine că mi-ai spus', ok:'Am înțeles'});
}
const TYPE_RO={gluc:'Glicemie', meal:'Masă', ins:'Insulină', kg:'Greutate', note:'Notă', act:'Activitate', ciclu:'Ciclu'};
function exportCSV(){
  const {H, rows}=evRows();
  const foodRows=S.foods.map(f=>({Data:'',Ora:'',Tip:'Aliment',Glicemie:'',Sursa:f.fav?'favorit':'',Insulina:'',Unitati:'',
    Scop:f.mode,Alimente:f.name,HC:f.val,Greutate:'',Nota:''}));
  rows.unshift(...foodRows);
  const q=v=>{ v=String(v??''); return (v.includes(';')||v.includes('"')||v.includes('\n'))?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv='\uFEFF'+'sep=;\n'+H.join(';')+'\n'+rows.map(r=>H.map(h=>q(r[h])).join(';')).join('\n');
  downloadOrShare('Nivelo_'+(S.settings.name||'profil')+'_'+stamp()+'.csv','text/csv;charset=utf-8',csv);
  toast('CSV generat, se deschide în Excel');
}
/* ================= EXPORT XLSX (generator propriu, zero dependențe) =================
   Un .xlsx este o arhivă ZIP cu fișiere XML. Scriem ZIP-ul fără compresie
   (metoda "store"), pe care Excel/LibreOffice/Google Sheets îl citesc normal.
   Astfel exportul nativ Excel rămâne în spiritul aplicației: un singur fișier, offline. */
const CRC_T=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
const xenc=s=>new TextEncoder().encode(s);
const xesc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function zipStore(files){
  const parts=[], central=[]; let off=0;
  const d=new Date(), dT=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const dD=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  files.forEach(f=>{
    const nm=xenc(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=[...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(dT),...u16(dD),
      ...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)];
    parts.push(new Uint8Array(lh), nm, f.data);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(dT),...u16(dD),
      ...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...nm]);
    off += lh.length + nm.length + sz;
  });
  const cdB=new Uint8Array([].concat(...central));
  const eo=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),
    ...u32(cdB.length),...u32(off),...u16(0)]);
  let tot=0; parts.forEach(p=>tot+=p.length); tot+=cdB.length+eo.length;
  const out=new Uint8Array(tot); let p=0;
  parts.forEach(x=>{ out.set(x,p); p+=x.length; });
  out.set(cdB,p); p+=cdB.length; out.set(eo,p);
  return out;
}

function importCSV(txt){
  txt=String(txt||'').replace(/^\uFEFF/,'').replace(/^sep=.\r?\n/,'');
  const firstLine=(txt.split('\n')[0]||'');
  const lines=parseCSV(txt, firstLine.includes(';')?';':',');
  if(!lines.length) return {error:'Fișierul CSV este gol.'};
  const H=lines.shift().map(h=>h.trim());
  const ix=n=>H.indexOf(n);
  // validare header: trebuie să fie un CSV Nivelo (măcar Data+Tip)
  if(ix('Tip')<0 || (ix('Data')<0 && !H.includes('Alimente'))){
    return {error:'Fișierul nu pare un CSV exportat din Nivelo (lipsesc coloanele așteptate).'};
  }
  const seen=new Set(S.events.map(e=>e.ts+'|'+e.type));
  const existingDays=new Set(S.events.map(e=>dKey(e.ts)));
  const K2T={'Glicemie':'gluc','Masă':'meal','Masa':'meal','Insulină':'ins','Insulina':'ins','Greutate':'kg','Notă':'note','Nota':'note','Activitate':'act'};
  // STAGING: construim în copii separate; comitem în S doar la final, dacă totul e ok
  const newEvents=[], newFoods=[]; const skipped=new Set();
  lines.forEach(c=>{
    if(c.length<2) return;
    if(c[ix('Tip')]==='Aliment'){
      const name=(c[ix('Alimente')]||'').trim(), val=parseFloat(String(c[ix('HC')]).replace(',','.'));
      if(name&&val>0 && !S.foods.some(f=>f.name.toLowerCase()===name.toLowerCase()) && !newFoods.some(f=>f.name.toLowerCase()===name.toLowerCase()))
        newFoods.push({id:uid(),name,mode:c[ix('Scop')]==='portie'?'portie':'per100',val,fav:(c[ix('Sursa')]||'').includes('fav'),uses:0});
      return;
    }
    if(ix('Data')<0 || !c[ix('Data')]) return;
    if(existingDays.has(c[ix('Data')])){ skipped.add(c[ix('Data')]); return; }
    const ts=new Date(c[ix('Data')]+'T'+(c[ix('Ora')]||'12:00')).getTime();
    if(isNaN(ts)) return;
    const tp=K2T[c[ix('Tip')]]; if(!tp) return;
    if(seen.has(ts+'|'+tp)) return;
    const e={id:uid(), ts, type:tp};
    if(tp==='gluc'){ const v=parseFloat(c[ix('Glicemie')]); if(!v||v<20||v>900) return; e.gluc={v, src:c[ix('Sursa')]||'deget'}; }
    if(tp==='ins'){ const u=parseFloat(c[ix('Unitati')]); if(!u||u<=0||u>100) return; e.ins={name:c[ix('Insulina')]||'Fiasp', u, kind:c[ix('Scop')]||'bolus'}; }
    if(tp==='meal'){
      const items=(c[ix('Alimente')]||'').split(' + ').filter(Boolean).map(x=>{
        const m=x.match(/^(.*?)(?:\s*\[(\d+(?:[.,]\d+)?)g\])?\s*=\s*([\d.,]+)HC$/);
        return m? {name:m[1].trim(), grams:m[2]?parseFloat(m[2].replace(',','.')):null, hc:parseFloat(m[3].replace(',','.'))||0} : {name:x.trim(), grams:null, hc:0};
      });
      e.meal={items, hc:parseFloat(String(c[ix('HC')]).replace(',','.'))||items.reduce((a,i)=>a+i.hc,0), note:c[ix('Nota')]||''};
    }
    if(tp==='kg'){ const v=parseFloat(String(c[ix('Greutate')]).replace(',','.')); if(!v||v<20||v>400) return; e.kg={v}; }
    if(tp==='note'||tp==='act'){ const t=(c[ix('Nota')]||'').trim(); if(!t) return; e.note={text:t}; }
    if(tp==='ciclu'){ const t=(c[ix('Nota')]||'').toLowerCase(); e.ciclu={faza: t.indexOf('termin')>=0?'stop':'start'}; }
    newEvents.push(e);
  });
  // COMIT: abia acum atingem datele reale
  S.events.push(...newEvents);
  S.foods.push(...newFoods);
  sortEv(); save();
  return {added:newEvents.length, foodsAdded:newFoods.length, skipped:skipped.size,
          ids:newEvents.map(e=>e.id), foodIds:newFoods.map(f=>f.id)};
}
function parseCSV(txt, sep){
  const out=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(inQ){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===sep){ row.push(cur); cur=''; }
    else if(ch==='\n'||ch==='\r'){ if(cur!==''||row.length){ row.push(cur); out.push(row); row=[]; cur=''; } }
    else cur+=ch;
  }
  if(cur!==''||row.length){ row.push(cur); out.push(row); }
  return out;
}

  cIns.filter(e=>e.ins.kind==='bazala').forEach(e=>{ const k=dKey(e.ts); bazPerDay[k]=(bazPerDay[k]||0)+1; });
  const bazMulti=Object.keys(bazPerDay).filter(k=>bazPerDay[k]>1);
  const bazAnomaly = bazMulti.length
    ? ` <b>De verificat:</b> ${bazMulti.length===1?'într-o zi':nUnit(bazMulti.length,'zile')} apar mai multe doze de bazală (${bazMulti.slice(0,3).join(', ')}${bazMulti.length>3?' …':''}), deci totalul acelei zile e însumat. Dacă e o notare dublă, o poți corecta din Istoric.`
    : '';
  const hcAll=cEvs.filter(e=>e.type==='meal').reduce((a,e)=>a+(e.meal.hc||0),0);
  // evoluție pe săptămâni (≤35 zile) sau pe luni
  const byWeek = days<=35;
  const buckets={};
  g.forEach(x=>{ const k=bucketKey(x.ts,byWeek); (buckets[k]=buckets[k]||{vs:[],ts:x.ts}).vs.push(x.v); });
  ins.filter(e=>e.ins.kind==='corectie').forEach(e=>{ const k=bucketKey(e.ts,byWeek); if(buckets[k]) buckets[k].cor=(buckets[k].cor||0)+1; });
  // insulina pe perioade: doar zile complete
  const bDays={}, bBol={}, bBaz={};
  cEvs.forEach(e=>{ const k=bucketKey(e.ts,byWeek); (bDays[k]=bDays[k]||new Set()).add(dKey(e.ts)); });
  cIns.forEach(e=>{ const k=bucketKey(e.ts,byWeek);
    if(e.ins.kind==='bazala'){ const dk=dKey(e.ts); (bBaz[k]=bBaz[k]||{}); bBaz[k][dk]=(bBaz[k][dk]||0)+e.ins.u; }
    else bBol[k]=(bBol[k]||0)+e.ins.u; });
  const trendRows=Object.keys(buckets).sort().map(k=>{
    const b=buckets[k], m=b.vs.reduce((a,x)=>a+x,0)/b.vs.length;
    const tir=Math.round(b.vs.filter(v=>v>=s.low&&v<=s.high).length/b.vs.length*100);
    const hypo=b.vs.filter(v=>v<s.low).length;
    const ndB=bDays[k]?bDays[k].size:0;
    const rap=ndB? fmtN((bBol[k]||0)/ndB)+' U':'—';
    const bz=bBaz[k]? fmtN(median(Object.values(bBaz[k])))+' U':'—';
    return `<tr><td>${byWeek?'Săpt. din ':''}${bucketLabel(b.ts,byWeek)}</td><td>${Math.round(m)}</td><td>${fmtN((m+46.7)/28.7)}%</td><td>${tir}%</td><td>${hypo}</td><td>${b.cor||0}</td><td>${rap}</td><td>${bz}</td><td>${b.vs.length}</td></tr>`;
  }).join('');
  const parts=['Dimineața','Prânz','Cină','Seara / noaptea'];
  const rowsPart=parts.map(p=>{ const pv=g.filter(x=>daypart(x.ts)===p).map(x=>x.v);
    return `<tr><td>${p}</td><td>${pv.length?Math.round(pv.reduce((a,b)=>a+b,0)/pv.length):'—'}</td><td>${pv.length?Math.min(...pv):'—'}</td><td>${pv.length?Math.max(...pv):'—'}</td><td>${pv.length}</td></tr>`; }).join('');
  const kg=evs.filter(e=>e.type==='kg');
  let journal='';
  if(detailed){
    const jDays=[...daysSet].reverse();
    journal='<h2>Jurnal detaliat, toate cele '+nUnit(daysSet.length,'zile')+' cu date din perioadă</h2><table><tr><th>Ziua</th><th>Evenimente</th></tr>'+
      jDays.map(k=>{
        const de=evOfDay(k).slice().sort((a,b)=>a.ts-b.ts);
        const parts=['Dimineața','Prânz','Cină','Seara / noaptea'];
        const evLine=e=>{
          if(e.type==='gluc') return tHM(e.ts)+': glicemie '+e.gluc.v;
          if(e.type==='ins') return tHM(e.ts)+': '+fmtN(e.ins.u)+' U '+e.ins.name+(e.ins.kind==='corectie'?' (corecție)':(e.ins.kind==='bazala'?' (bazală)':''));
          if(e.type==='meal') return tHM(e.ts)+': masă '+(e.meal.hc?fmtN(e.meal.hc)+' HC: ':'')+e.meal.items.map(i=>i.name).join(', ').slice(0,180)+(e.meal.note?' · '+esc(e.meal.note):'');
          if(e.type==='kg') return tHM(e.ts)+': greutate '+fmtN(e.kg.v)+' kg';
          if(e.type==='ciclu') return tHM(e.ts)+': ciclu menstrual, '+(e.ciclu && e.ciclu.faza==='stop'?'s-a terminat':'a început');
          return tHM(e.ts)+': '+esc(e.note?e.note.text:'').slice(0,180);
        };
        let blocks='';
        parts.forEach(p=>{
          const pe=de.filter(e=>daypart(e.ts)===p);
          if(!pe.length) return;
          const hc=pe.filter(e=>e.type==='meal').reduce((a,e)=>a+(e.meal.hc||0),0);
          const label=p.replace(' / noaptea','');
          blocks+=`<div style="margin-top:4px"><b>${label}</b>${hc>0?` <span style="color:var(--hc-ink)">· ${fmtHC(hc)} HC</span>`:''}<br>`+
                  pe.map(evLine).join('<br>')+'</div>';
        });
        return `<tr><td style="white-space:nowrap;vertical-align:top">${dNice(de[0].ts)}</td><td>${blocks}</td></tr>`;
      }).join('')+'</table>';
  }
  $('report').innerHTML=`
    <h1>Jurnal glicemic · ${esc(s.name||'')}</h1>
    <div class="rmeta">Perioada: ultimele ${nUnit(days,'zile')}, până la ${dNice(Date.now())} · ${nUnit(daysSet.length,'zile')} cu date · Țintă: ${s.low}–${s.high} mg/dl · Generat din Nivelo</div>
    <div style="border:1px solid #ccc; border-radius:8px; padding:10px 13px; margin:12px 0; font-size:calc(12px*var(--fs)); color:#333; line-height:1.55">
      <b style="display:block; margin-bottom:4px">Cum se citesc cifrele din raport</b>
      <div><b>Tipic</b> = valoarea din mijloc a datelor, cea în jurul căreia stau cele mai multe (mediana).</div>
      <div><b>Jumătatea din mijloc</b> (a zilelor sau a meselor) = zona în care se încadrează jumătatea din mijloc a valorilor, lăsând deoparte sfertul cel mai mic și sfertul cel mai mare; e mai aproape de realitate decât extremele.</div>
      <div><b>Extreme</b> = cea mai mică și cea mai mare valoare; pot proveni dintr-o singură zi neobișnuită.</div>
      <div><b>Nr. observații (n)</b> = pe câte zile, respectiv mese, se sprijină cifra.</div>
      <div><b>În țintă</b> = procentul măsurătorilor între ${s.low} și ${s.high} mg/dl.</div>
      <div><b>HbA1c estimat</b> = aproximare din media glicemiilor capilare; orientativă, nu analiză de laborator.</div>
    </div>
    <h2>Imagine de ansamblu</h2>
    <table>
      <tr><th>Medie glicemică</th><th>HbA1c estimat*</th><th>În țintă</th><th>Sub țintă (hipo)</th><th>Peste țintă</th><th>Măsurători</th><th>Măsurători / zi cu date</th></tr>
      <tr><td><b>${Math.round(avg)} mg/dl</b></td><td><b>${fmtN(a1c)}%</b></td><td>${Math.round(ni/vals.length*100)}%</td>
          <td>${Math.round(nl/vals.length*100)}% (${nl})</td><td>${Math.round((vals.length-nl-ni)/vals.length*100)}%</td><td>${vals.length}</td><td>${fmtN(vals.length/nd)}</td></tr>
    </table>
    <h2>Evoluția pe ${byWeek?'săptămâni':'luni'}</h2>
    <table><tr><th>${byWeek?'Săptămâna':'Luna'}</th><th>Medie</th><th>A1c est.</th><th>În țintă</th><th>Hipo</th><th>Corecții</th><th>Rapidă/zi</th><th>Bazală/zi</th><th>Măsurători</th></tr>${trendRows}</table>
    <h2>Glicemii pe momente ale zilei</h2>
    <table><tr><th>Moment</th><th>Medie</th><th>Min</th><th>Max</th><th>Nr.</th></tr>${rowsPart}</table>
    <h2>Insulină și mese, pe zile complete (ziua curentă exclusă)</h2>
    <table>
      <tr><th>Indicator</th><th>Tipic (mediană)</th><th>Jumătatea din mijloc</th><th>Extreme</th><th>Nr. observații</th></tr>
      ${statRow('Rapidă / zi', arr(rapidByDay).filter(x=>x>0), ' U')}
      ${statRow('Bazală / zi', Object.values(bazByDay).filter(x=>x>0), ' U')}
      ${statRow('Corecții / zi', arr(corrByDay), '')}
      ${statRow('HC / zi', arr(hcByDay).filter(x=>x>0), '')}
      ${statRow('Rapidă / masă', bolMeals.filter(x=>x>0), ' U')}
    </table>
    <p style="color:#444; font-size:calc(12px*var(--fs))">„Jumătatea din mijloc" = zona în care se încadrează jumătatea din mijloc a valorilor, fără sfertul cel mai mic și cel mai mare; e mai aproape de realitate decât extremele, care pot veni dintr-o singură zi neobișnuită. „Nr. observații" = numărul de zile, cu excepția rândului „Rapidă / masă", unde sunt mese. <b>Corecțiile includ și zilele fără nicio corecție</b>, ca frecvența să fie reală. Pentru insulină și carbohidrați se numără doar zilele în care s-a notat ceva, fiindcă o zi nenotată nu înseamnă o zi fără mâncare sau fără insulină.${bazAnomaly}</p>
    ${(function(){
      const icr=computeICR(cEvs); const isf=computeISF(cEvs);
      const parts=['Dimineața','Prânz','Cină','Seara'];
      const rows=parts.map(p=>{ const v=(icr[p]||[]).filter(x=>x>0);
        if(!v.length) return `<tr><td>${p}</td><td colspan="4">nu s-au putut forma perechi masă+bolus</td></tr>`;
        const r=x=>Math.round(x);
        return `<tr><td>${p}</td><td><b>1 U la ${r(median(v))} g</b></td>`
          +`<td>1 U la ${r(pctl(v,.25))}–${r(pctl(v,.75))} g</td>`
          +`<td>1 U la ${r(Math.min(...v))}–${r(Math.max(...v))} g</td>`
          +`<td>${v.length}</td></tr>`; }).join('');
      const isfLine = isf.vals.length>=10
        ? `scădere tipică <b>${Math.round(median(isf.vals))} mg/dl la 1 U</b>; jumătatea corecțiilor între ${Math.round(pctl(isf.vals,.25))} și ${Math.round(pctl(isf.vals,.75))} mg/dl la 1 U (extreme ${Math.round(Math.min(...isf.vals))}–${Math.round(Math.max(...isf.vals))}), din ${nUnit(isf.clean,'corecții care intră în calcul','o corecție care intră în calcul')}`
        : `<b>date insuficiente pentru o estimare fiabilă</b>: doar ${nUnit(isf.clean,'corecții care intră în calcul','o corecție care intră în calcul')} din cele ${isf.total} din perioadă. Se afișează o valoare de la 10 în sus`;
      return `<h2>Parametri derivați: ICR și ISF (observați, ziua curentă exclusă)</h2>
        <p style="color:#444">Valori <b>descriptive</b>, calculate din ce s-a practicat efectiv. Nu sunt recomandări de dozare; interpretarea aparține medicului.</p>
        <h3 style="font-size:calc(14px*var(--fs)); margin:10px 0 4px">ICR: raportul insulină/carbohidrați</h3>
        <p style="color:#444; font-size:calc(12px*var(--fs))">Se formează perechi între fiecare masă cu carbohidrați notați și bolusul rapid cel mai apropiat, dacă cele două sunt la cel mult 25 de minute distanță. Pentru fiecare pereche se calculează câte grame de carbohidrați au revenit unei unități. Mesele fără bolus asociat, sau sub 5 / peste 200 g HC, nu intră în calcul.</p>
        <table><tr><th>Moment</th><th>Tipic (mediană)</th><th>Jumătatea meselor</th><th>Extreme</th><th>Nr. perechi</th></tr>${rows}</table>
        <p style="color:#444; font-size:calc(12px*var(--fs))">„Jumătatea meselor" = zona în care se încadrează jumătatea din mijloc a meselor, fără cele mai mici și cele mai mari valori; extremele provin adesea din mese la care ora notată a bolusului nu a coincis exact cu masa, deci sunt de citit cu rezervă. „Nr. perechi" arată pe câte perechi masă+bolus se sprijină cifra.</p>
        <h3 style="font-size:calc(14px*var(--fs)); margin:14px 0 4px">ISF: factorul de corecție</h3>
        <p style="color:#444; font-size:calc(12px*var(--fs))">Arată cu cât a scăzut glicemia după o unitate de insulină administrată ca <i>corecție</i>. Se iau în calcul doar corecțiile „curate": cele care au o glicemie măsurată în cele 30 de minute dinainte, o alta la 2–4 h după, și <b>nicio masă și niciun alt bolus în acest interval</b>, altfel scăderea nu poate fi atribuită corecției. Din acest motiv, numărul de corecții care intră în calcul e de obicei mult mai mic decât numărul total de corecții.</p>
        <p style="margin-top:4px">${isfLine}.</p>`;
    })()}
    <p style="color:#444">Valorile sunt interval minim–maxim pe ${nUnit(cDays,'zile')} complete; „tipic" = mediana. Doza zilnică de bazală și dozele la masă se citesc astfel mai fidel decât ca medie unică.</p>
    ${kg.length?`<h2>Greutate</h2><p>${fmtN(kg[0].kg.v)} kg (${dNice(kg[0].ts)}) → ${fmtN(kg[kg.length-1].kg.v)} kg (${dNice(kg[kg.length-1].ts)})</p>`:''}
    ${(()=>{
      if(!cicluPornit()) return '';
      // perioadele se calculează din TOT istoricul, nu doar din fereastra raportului:
      // altfel un ciclu început înainte de fereastră și-ar pierde începutul, iar zilele
      // lui ar fi numărate greșit ca „în rest" în comparație
      const perT=cicluPerioade();
      const zile=zileCiclu(perT);
      const c=cicluCompara(evs, zile);
      // în tabel arătăm doar ciclurile care ating perioada raportului
      const per=perT.filter(p=>(p.stop||Date.now())>=from);
      if(!per.length) return '';
      const zi=t=>{ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
      const durata=p=>p.stop? Math.round((zi(p.stop)-zi(p.start))/MS_D)+1 : null;
      // intervalul dintre cicluri se măsoară de la un început la următorul
      const inter=[];
      for(let i=1;i<per.length;i++) inter.push(Math.round((zi(per[i].start)-zi(per[i-1].start))/MS_D));
      const dur=per.map(durata).filter(x=>x!=null);
      const randuri=per.map(p=>{
        const d=durata(p);
        const stare = p.curent ? 'în curs' : (p.incert ? 'sfârșit nenotat' : nUnit(d,'zile','o zi'));
        return `<tr><td>${dNice(p.start)}</td><td>${p.stop?dNice(p.stop):'—'}</td><td>${stare}</td></tr>`;
      }).join('');
      const cmp = (c.mens && c.rest && c.mens.n>=5) ? `
        <h3 style="font-size:14px; margin:12px 0 4px">Glicemia în timpul menstruației față de restul zilelor</h3>
        <table><tr><th>Indicator</th><th>În menstruație</th><th>În rest</th></tr>
          <tr><td>Medie glicemică</td><td><b>${c.mens.medie} mg/dl</b></td><td>${c.rest.medie} mg/dl</td></tr>
          <tr><td>Timp în țintă</td><td>${c.mens.tir}%</td><td>${c.rest.tir}%</td></tr>
          <tr><td>Rapidă / zi (mediană)</td><td>${c.mens.rapid!=null?fmtN(c.mens.rapid)+' U':'—'}</td><td>${c.rest.rapid!=null?fmtN(c.rest.rapid)+' U':'—'}</td></tr>
          <tr><td>Măsurători / zile cu date</td><td>${c.mens.n} / ${c.mens.zile}</td><td>${c.rest.n} / ${c.rest.zile}</td></tr>
        </table>
        <p style="color:#444; font-size:12px">Se socotesc zile calendaristice întregi: ziua în care a fost notat începutul și cea în care a fost notat sfârșitul intră complet, indiferent de ora marcată. Comparația include doar perioadele la care s-a notat și sfârșitul, fiindcă altfel durata nu e cunoscută. Cifrele sunt descriptive, din jurnalul pacientei.</p>`
        : `<p style="color:#444; font-size:12px">Deocamdată nu sunt destule măsurători în zilele de menstruație pentru o comparație cu sens.</p>`;
      return `<h2>Ciclu menstrual</h2>
        <p style="color:#444">Notat de pacientă în jurnal. Util fiindcă sensibilitatea la insulină se modifică frecvent pe parcursul ciclului, iar glicemiile pot urma acest tipar.</p>
        <table><tr><th>Început</th><th>Sfârșit</th><th>Durată</th></tr>${randuri}</table>
        <p style="color:#444; font-size:12px">
          ${dur.length?`Durată tipică: <b>${nUnit(median(dur),'zile','o zi')}</b> (din ${nUnit(dur.length,'cicluri','un ciclu')} cu sfârșit notat). `:''}
          ${inter.length?`Interval tipic între începuturi: <b>${nUnit(median(inter),'zile','o zi')}</b>.`:''}
        </p>
        ${cmp}`;
    })()}
    <p>*HbA1c estimat din media măsurătorilor capilare (formula ADA eAG→A1c); tendință orientativă, nu înlocuiește dozarea de laborator.</p>
    ${journal}`;
  closeSheet();
  window.print();
}

    <p class="muted">Șterge toate intrările din ziua aleasă. Folosește-o când o zi a fost dublată, apoi poți reimporta CSV-ul: zilele goale se completează la loc din istoric.</p>

function okDelDay(){
  const v=$('dd').value; if(!v){ toast('Alege data'); return; }
  const gone=S.events.filter(e=>dKey(e.ts)===v);
  const n=gone.length;
  if(!n){ toast('Nicio intrare în ziua aleasă'); return; }
  shConfirm('Vei putea anula imediat după, dacă te răzgândești.', ()=>{
    S.events=S.events.filter(e=>dKey(e.ts)!==v); save();
    setUndo({op:'del', items:gone, label:nUnit(n,'intrări șterse','o intrare ștearsă')+' din '+v, undone:'Ziua a revenit în jurnal'});
    renderToday(); renderHist();
  }, {title:'Ștergi '+nUnit(n,'intrări','o intrare')+' din '+v+'?', confirmLabel:'Șterge ziua'});
}

function shConsent(){

/* Chrome pe Android „îngheață" intenționat șirul clasic (raportează mereu Android 10
   și o versiune rotunjită), ca măsură de confidențialitate. Datele reale se cer
   explicit, prin interfața de „client hints". Dacă nu există, cădem pe citirea
   șirului clasic — corectă pe iOS și pe desktop. */
async function deviceLabel(){
  try{
    const d=navigator.userAgentData;
    if(d && d.getHighEntropyValues){
      const h=await d.getHighEntropyValues(['platformVersion','model','fullVersionList']);
      const out=[];
      if(d.platform) out.push(d.platform+(h.platformVersion? ' '+String(h.platformVersion).split('.')[0] : ''));
      const brands=(h.fullVersionList||d.brands||[]).filter(b=>!/not[^a-z]*a[^a-z]*brand/i.test(b.brand||''));
      const pick=brands.find(b=>!/chromium/i.test(b.brand))||brands[0];
      if(pick) out.push(pick.brand+' '+String(pick.version||'').split('.')[0]);
      if(h.model) out.push(h.model);
      if(out.length>1) return out.join(' · ');
    }
  }catch(e){}
  return deviceLabelUA();
}
function deviceLabelUA(){
  const ua=navigator.userAgent||'';
  const out=[];
  // Chrome pe Android „îngheață" intenționat aceste date: raportează mereu
  // Android 10 și modelul „K", indiferent de telefon. Dacă vedem semnătura asta,
  // spunem cinstit că versiunea e ascunsă, în loc să afișăm una falsă.
  const frozen = /Android 10[;)]/.test(ua) && /;\s*K[;)]/.test(ua);
  let m;
  if(frozen) out.push('Android (versiune ascunsă de browser)');
  else if((m=ua.match(/Android\s+([\d.]+)/))) out.push('Android '+m[1]);
  else if((m=ua.match(/(?:iPhone )?OS\s+(\d+)[_.](\d+)/)) && /iPhone|iPad|iPod/.test(ua)) out.push('iOS '+m[1]+'.'+m[2]);
  else if(/Windows NT 10/.test(ua)) out.push('Windows');
  else if((m=ua.match(/Mac OS X\s+(\d+)[_.](\d+)/))) out.push('macOS '+m[1]+'.'+m[2]);
  else if(/Linux/.test(ua)) out.push('Linux');
  // browser (ordinea contează: Edge/Samsung/Opera se dau drept Chrome)
  if((m=ua.match(/EdgA?\/([\d]+)/))) out.push('Edge '+m[1]);
  else if((m=ua.match(/SamsungBrowser\/([\d]+)/))) out.push('Samsung Internet '+m[1]);
  else if((m=ua.match(/OPR\/([\d]+)/))) out.push('Opera '+m[1]);
  else if((m=ua.match(/FxiOS\/([\d]+)|Firefox\/([\d]+)/))) out.push('Firefox '+(m[1]||m[2]));
  else if((m=ua.match(/CriOS\/([\d]+)/))) out.push('Chrome '+m[1]);
  else if((m=ua.match(/Chrome\/([\d]+)/))) out.push('Chrome '+m[1]);
  else if(/Safari/.test(ua)) out.push('Safari');
  // modelul telefonului; pe Android modern e ascuns („K"), pe iOS nu e publicat
  if(!frozen && (m=ua.match(/Android[^;]*;\s*([^;)]+?)(?:\s+Build\/|\))/))){
    const model=m[1].trim();
    if(model && !/^(wv|K)$/i.test(model) && model.length<40) out.push(model);
  } else if(/iPhone/.test(ua)) out.push('iPhone');
  else if(/iPad/.test(ua)) out.push('iPad');
  return out.length? out.join(' · ') : 'nedetectat';
}

function wipeMirror(){

    {title:'Ștergi copia de siguranță?', confirmLabel:'Șterge'});
}
async function idbWipe(){
  try{
    const db=await idbOpen();
    await new Promise((res,rej)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(IDB_ROW);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
    });
    db.close();
  }catch(e){}
}
/* ================= INDICATOR BACKUP ================= */
function bkAge(){
  const lb=S.settings.lastBackup;
  if(!lb) return {never:true, d:null};
  return {never:false, d:Math.floor((Date.now()-lb)/MS_D), ts:lb};
}
function bkText(){
  const a=bkAge();
  if(a.never) return 'Niciun backup făcut încă';
  if(a.d<=0) return 'Ultimul backup: azi';
  if(a.d===1) return 'Ultimul backup: ieri';
  return 'Ultimul backup: acum '+nUnit(a.d,'zile','o zi');
}
function renderBkLine(){
  const el=$('bkline'); if(!el) return;
  if(S.events.length<=3){ el.innerHTML=''; return; }   // jurnal aproape gol: nu deranjăm
  const a=bkAge();
  const cls = a.never||a.d>=14 ? 'bad' : a.d>=7 ? 'warn' : '';
  el.innerHTML=`<div class="bkline ${cls}"><i></i><span>${bkText()}</span>
    <button onclick="backupNow()">Fă unul acum</button></div>`;
}
function renderMore(){
  const s=S.settings;
  $('setSummary').textContent=(s.name||'Fără nume')+' · țintă '+s.low+'–'+s.high+' · '+s.insulins.join(' + ');
  const a=bkAge(), bi=$('bkinfo');
  if(bi){
    bi.innerHTML = a.never
      ? 'Niciun backup făcut încă.<br>Datele trăiesc doar pe acest telefon.'
      : esc(bkText())+'<br>Recomandat săptămânal.';
  }
}

/* ================= BACKUP REMINDER ================= */
function bannerCheck(){
  const b=$('banner');
  if(S.events.length<=3){ b.style.display='none'; return; }
  const dd=Math.floor((Date.now()-(S.settings.lastBackup||0))/MS_D);
  const never=!S.settings.lastBackup;
  if(!never && dd<7){ b.style.display='none'; return; }
  b.style.display='block';
  b.classList.remove('urgent');
  if(never){
    b.innerHTML='<b>Nu ai făcut încă niciun backup.</b>Datele tale trăiesc doar pe acest telefon. Dacă îl schimbi sau ștergi aplicația, se pierd. Un backup durează 30 de secunde.<br><button onclick="backupNow()">Fă primul backup →</button>';
  } else if(dd>=21){
    b.classList.add('urgent');
    b.innerHTML='<b>⚠ Au trecut '+nUnit(dd,'zile')+' fără backup!</b>Riști să pierzi tot jurnalul dacă se întâmplă ceva cu telefonul. Fă un backup chiar acum, durează 30 de secunde.<br><button onclick="backupNow()">Fă backup acum →</button>';
  } else if(dd>=14){
    b.innerHTML='<b>Au trecut '+nUnit(dd,'zile')+' de la ultimul backup.</b>Jurnalul e doar pe acest telefon. Merită 30 de secunde de siguranță.<br><button onclick="backupNow()">Fă backup acum →</button>';
  } else {
    b.innerHTML='<b>A trecut o săptămână de la ultimul backup.</b>30 de secunde de siguranță pentru jurnalul tău.<br><button onclick="backupNow()">Fă backup acum →</button>';
  }
}

/* ===== SCURTĂTURI DE PE ICONIȚĂ =====
   Ținere apăsată pe iconița aplicației → „Adaugă glicemie / masă / insulină".
   Scurtătura deschide aplicația cu ?adauga=…, iar noi ducem omul direct în
   fereastra potrivită. Se aplică doar la o pornire configurată: dacă e prima
   dată, sau dacă datele nu s-au putut citi, acele ecrane au prioritate.
   Adresa e curățată imediat, ca o reîncărcare să nu redeschidă fereastra. */
function openShortcut(){
  let what=null;
  try{ what=new URLSearchParams(location.search).get('adauga'); }catch(e){}
  if(!what) return;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  const map={glicemie:'shGluc', masa:'shMeal', insulina:'shIns'};
  const fn=map[what];
  if(!fn || typeof window[fn]!=='function') return;
  setTimeout(()=>{ try{ window[fn](); }catch(e){} }, 120);
}
/* ===== VERSIUNE NOUĂ: anunț și „Ce e nou" =====

}

function verParts(v){ return String(v||'').replace(/^v/,'').split('.').map(n=>parseInt(n,10)||0); }
function verGT(a,b){
  const A=verParts(a), B=verParts(b);
  for(let i=0;i<Math.max(A.length,B.length);i++){
    const x=A[i]||0, y=B[i]||0;
    if(x!==y) return x>y;
  }
  return false;
}
function checkWhatsNew(){
  const vazut=S.settings.lastVer;
  if(vazut===APP_VER) return;
  S.settings.lastVer=APP_VER; save();
  if(!vazut) return;                        // prima instalare: n-are cu ce compara
  const noi=NOUTATI.filter(n=>verGT(n.v, vazut));
  if(!noi.length) return;
  // Fraza se construiește ca să nu înceapă niciodată cu literă mică după punct:
  // varianta cu numărătoare intră în propoziție, nu după ea.
  const drum = noi.length>1
    ? `Ai trecut de la ${esc(vazut)} la ${esc(APP_VER)}, prin ${nUnit(noi.length,'versiuni','o versiune')}.`
    : `Ai trecut de la ${esc(vazut)} la ${esc(APP_VER)}.`;
  openSheet(`<h3>Ce e nou</h3>
    <p class="muted" style="margin-bottom:14px">${drum}</p>
    ${noi.map(n=>`<div class="card wn-card">
      <span class="wn-ver">${esc(n.v)}</span>
      <ul class="wn-list">${n.ce.map(t=>`<li><i></i><span>${esc(t)}</span></li>`).join('')}</ul>
    </div>`).join('')}
    <div class="wn-foot">Dacă ceva nu merge cum te aștepți, scrie-mi din <b>Mai mult → Trimite feedback</b>. Chiar citesc tot.</div>
    <button class="btn btn-p" style="margin-top:12px" onclick="closeSheet()">Am înțeles</button>`);
}
if('serviceWorker' in navigator && location.protocol==='https:'){

}
